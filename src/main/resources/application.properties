# ------------------------------------------------------------------------------------------------------------------
# The Falling Whale
# ------------------------------------------------------------------------------------------------------------------
quarkus.application.name=the-falling-whale
quarkus.banner.path=banner.txt

# ------------------------------------------------------------------------------------------------------------------
# La cave : PostgreSQL du docker compose en dev, H2 en mémoire pour les tests
# ------------------------------------------------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=tavernier
quarkus.datasource.password=hydromel
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/falling_whale
quarkus.datasource.jdbc.telemetry=true
quarkus.datasource.metrics.enabled=true
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.packages=fr.eletutour.tavern.domain
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# La main courante des incidents : même base, mais sa propre unité de persistance et son propre schéma, jamais effacés.
# La cave est recréée à chaque démarrage pour la démo ; le journal des incidents, lui, survit aux redémarrages, et le
# post-mortem avec lui. Son schéma est versionné par Flyway (db/migration), appliqué avant le démarrage d'Hibernate :
# Hibernate n'y touche pas.
quarkus.hibernate-orm."main-courante".datasource=<default>
quarkus.hibernate-orm."main-courante".packages=fr.eletutour.tavern.incident
quarkus.hibernate-orm."main-courante".database.default-schema=main_courante
quarkus.hibernate-orm."main-courante".schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=main_courante

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
# DATABASE_TO_LOWER : H2 range les noms en minuscules, comme PostgreSQL et comme Flyway les écrit
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:falling_whale;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
%test.quarkus.datasource.jdbc.telemetry=false

%prod.quarkus.datasource.jdbc.url=${TAVERN_DB_URL:jdbc:postgresql://localhost:5432/falling_whale}
%prod.quarkus.hibernate-orm.schema-management.strategy=update

# ------------------------------------------------------------------------------------------------------------------
# La guilde des marchands : fournisseur "distant" appelé par le REST Client (couche HTTP_OUT de Goblin).
# Pour la démo elle est servie par l'application elle-même.
# ------------------------------------------------------------------------------------------------------------------
quarkus.rest-client.guilde-des-marchands.url=http://localhost:${quarkus.http.port}
quarkus.rest-client.guilde-des-marchands.connect-timeout=1000
quarkus.rest-client.guilde-des-marchands.read-timeout=3000
%test.quarkus.rest-client.guilde-des-marchands.url=http://localhost:${quarkus.http.test-port:8081}

# ------------------------------------------------------------------------------------------------------------------
# Le comptoir : documentation OpenAPI
# ------------------------------------------------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=The Falling Whale API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=La taverne The Falling Whale : grimoire des recettes, cave, aventuriers et commandes. \
  Toutes les erreurs suivent le format RFC 9457 (application/problem+json).
quarkus.smallrye-openapi.info-contact-name=Erwan Le Tutour
quarkus.smallrye-openapi.info-contact-url=https://github.com/ErwanLT/quarkus-goblin-demo
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=The Falling Whale

# ------------------------------------------------------------------------------------------------------------------
# La tour de guet : métriques, traces et logs corrélés
# ------------------------------------------------------------------------------------------------------------------
quarkus.micrometer.binder.http-server.match-patterns=/grimoire/recettes/[0-9]+=/grimoire/recettes/{id},\
  /grimoire/ingredients/[0-9]+=/grimoire/ingredients/{id},/aventuriers/[0-9]+=/aventuriers/{id},\
  /commandes/[0-9]+=/commandes/{id},/cave/stocks/[0-9]+.*=/cave/stocks/{ingredientId}
quarkus.micrometer.export.prometheus.step=PT5S
# la salle (page et flux SSE ouvert en continu) fausserait la latence par route
quarkus.micrometer.binder.http-server.ignore-patterns=/salle.*,/assets/.*

quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
quarkus.otel.traces.sampler=parentbased_always_on
quarkus.otel.traces.suppress-application-uris=/salle/evenements,/assets/*
# les logs partent aussi en OTLP vers le collecteur, puis Loki : chaque ligne garde son traceId et son spanId
quarkus.otel.logs.enabled=true
%test.quarkus.otel.sdk.disabled=true

# La stack d'observabilité et la base sont fournies par le docker compose, démarré à la main : pas de Dev Service
# LGTM (que Quarkus ajoute en dev mode dès qu'OpenTelemetry est présent) ni de démarrage automatique du compose.
%dev.quarkus.observability.enabled=false
%dev.quarkus.compose.devservices.enabled=false
# Prometheus (dans Docker) scrape l'application via host.docker.internal : en dev mode, Quarkus n'accepte par défaut que
# les requêtes adressées à localhost (protection contre le DNS rebinding).
%dev.quarkus.http.host-validation.allowed-hosts=localhost,127.0.0.1,host.docker.internal

quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO

# En dev mode, une copie des logs dans un fichier, quel que soit le terminal qui a lancé l'application
%dev.quarkus.log.file.enabled=true
%dev.quarkus.log.file.path=target/logs/the-falling-whale.log
%dev.quarkus.log.file.level=INFO
%dev.quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p traceId=%X{traceId} spanId=%X{spanId} [%c{2.}] (%t) %s%e%n
%dev.quarkus.log.file.rotation.max-file-size=10M
%dev.quarkus.log.file.rotation.max-backup-index=3

# Chaque assaut du gobelin est loggé en DEBUG : visible dans Loki, sans inonder la console ni le fichier
%dev.quarkus.log.category."io.quarkiverse.goblin".level=DEBUG
%dev.quarkus.log.category."fr.eletutour.tavern".level=DEBUG

# ------------------------------------------------------------------------------------------------------------------
# Le gobelin : chaos engineering (actif en dev mode uniquement, jamais dans un build de production)
# Au démarrage : un peu de latence sur 25 % des requêtes REST entrantes. Tout le reste se pilote depuis la Dev UI.
# ------------------------------------------------------------------------------------------------------------------
quarkus.goblin.enabled=true
quarkus.goblin.assault.type=LATENCY
quarkus.goblin.assault.latency.min-milliseconds=50
quarkus.goblin.assault.latency.max-milliseconds=400
quarkus.goblin.target.level=25
quarkus.goblin.target.include-packages=fr.eletutour.tavern
# pas de chaos dans l'infrastructure (mappers d'erreurs, métriques et traces, données initiales), ni dans la salle ni
# dans la main courante : l'écran de démo et le journal des incidents doivent tenir pendant que le gobelin attaque
quarkus.goblin.target.exclude-packages=fr.eletutour.tavern.exception,fr.eletutour.tavern.observability,\
  fr.eletutour.tavern.bootstrap,fr.eletutour.tavern.salle,fr.eletutour.tavern.incident

# ------------------------------------------------------------------------------------------------------------------
# La main courante : le journal des incidents, et le post-mortem qui en est tiré
# Un incident s'ouvre au premier signe de dégradation vu par un client ou par la résilience (commande perdue ou
# abandonnée, carte servie depuis l'ardoise, livraison manquée, disjoncteur ouvert), et se clôt après une période de
# calme, disjoncteur refermé.
# ------------------------------------------------------------------------------------------------------------------
taverne.main-courante.calme=30s
taverne.main-courante.consignation=2s
%test.taverne.main-courante.calme=100ms
# en test, la consignation est déclenchée à la main, pour des tests déterministes
%test.quarkus.scheduler.enabled=false
