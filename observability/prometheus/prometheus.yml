# Le guetteur : scrape l'application Quarkus toutes les 5 secondes.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: the-falling-whale
    metrics_path: /q/metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: the-falling-whale

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
